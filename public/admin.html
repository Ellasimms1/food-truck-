<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <link rel="stylesheet" href="/styles/site.css">
    <script src="/scripts/site.js" defer></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Homepage</a></li>
            <li><a href="/admin">Admin</a></li>
        </ul>
    </nav>
    
    <h1>Admin Page</h1>
    <h2>Update the Menu</h2>
    <form id="menuForm">
        <label for="menuName">Enter the new menu item name:</label>
        <input type="text" id="menuName" required>
        <br>

        <label for="menuDescription">Enter the description of the menu item:</label>
        <input type="text" id="menuDescription" required>
        <br>

        <label for="menuPrice">Enter the price for the menu item:</label>
        <input type="number" id="menuPrice" min="0" step="0.01" placeholder="0.00" required>
        <br>

        <label for="menuImageURL">Enter the image url of the menu item:</label>
        <input type="url" id="menuImageURL" required>
        <br>

        <button type="button" id="menuButton">Add Menu Item</button>
    </form>

    <h2>Add an Event</h2>
    <form id="eventForm">
        <label for="eventName">Enter the new event:</label>
        <input type="text" id="eventName" required>
        <br>

        <label for="eventDate">Enter the date of the event:</label>
        <input type="date" id="eventDate" required>
        <br>

        <label for="eventLocation">Enter the location of the event:</label>
        <input type="text" id="eventLocation" required>
        <br>

        <label for="eventTime">Enter the time of the event:</label>
        <input type="time" id="eventTime" required>
        <br>

        <button type="button" id="eventButton">Add Event</button>
    </form>
    
</body>
</html>
